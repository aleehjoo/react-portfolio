<!doctype html>
<html lang="en" data-space="white">
  <head>
    <meta charset="UTF-8" />
    <!--
      ?v= is a cache-buster. Browsers cache favicons per-origin and hold on to
      them well past a file change, so without a new URL the previous icon
      keeps being drawn. Bump it if the icon ever changes again.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="180x180"
      href="/favicon-180.png?v=2"
    />
    <link rel="apple-touch-icon" href="/favicon-180.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alejandro Umila — portfolio. Something is waiting in the white."
    />
    <title>ALEJANDRO UMILA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
